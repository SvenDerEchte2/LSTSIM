  <style>
    /* Globales Grundlayout */
    html, body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background-color: #0a0a0c;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff;
    }

    /* Haupt-Container: Teilt Bildschirm in Links (Formular + Komm) und Rechts (Sidebar) */
    .dashboard-container {
      flex: 1;
      display: flex;
      overflow: hidden;
      height: calc(100vh - 100px);
    }

    /* LINKER BEREICH */
    .left-main-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 15px;
      gap: 15px;
      overflow-y: auto;
      box-sizing: border-box;
    }

    .dispatch-form-panel {
      background: #12141d;
      border: 1px solid #2a2d3d;
      border-radius: 8px;
      padding: 15px;
    }

    /* KOMMUNIKATIONS-CENTER */
    .comm-center-grid {
      display: grid;
      grid-template-columns: 1.6fr 1fr;
      gap: 15px;
    }

    .comm-card {
      background: #12141d;
      border: 1px solid #2a2d3d;
      border-radius: 8px;
      padding: 15px;
      display: flex;
      flex-direction: column;
    }

    .comm-card-title {
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #8a8f9e;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* ANRUFERLISTE / WARTESCHLANGE */
    .call-queue-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 180px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .no-calls-msg {
      font-size: 12px;
      color: #666;
      font-style: italic;
      padding: 10px 0;
      text-align: center;
    }

    .call-queue-item {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      transition: all 0.2s ease;
    }

    /* STATUS: AKTIV (Eingehnd / Klingelt) */
    .call-queue-item.status-aktiv {
      border-left: 4px solid #ff3b30;
      background: rgba(255, 59, 48, 0.12);
      animation: pulse-ring 1.5s infinite;
    }

    /* STATUS: GEHALTEN (In Warteschleife) */
    .call-queue-item.status-halten {
      border-left: 4px solid #ff9500;
      background: rgba(255, 149, 0, 0.08);
    }

    /* STATUS: ANGENOMMEN (Aktiv im Gespräch) */
    .call-queue-item.status-angenommen {
      border-left: 4px solid #34c759;
      background: rgba(52, 199, 89, 0.08);
    }

    @keyframes pulse-ring {
      0% { border-color: #ff3b30; }
      50% { border-color: #ff9500; }
      100% { border-color: #ff3b30; }
    }

    .call-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .call-line-badge {
      font-size: 11px;
      font-weight: bold;
    }
    .status-aktiv .call-line-badge { color: #ff3b30; }
    .status-halten .call-line-badge { color: #ff9500; }
    .status-angenommen .call-line-badge { color: #34c759; }

    .call-number-text {
      font-size: 13px;
      font-weight: 600;
      color: #fff;
    }

    .call-actions {
      display: flex;
      gap: 6px;
    }

    .call-btn {
      padding: 6px 10px;
      border-radius: 4px;
      border: none;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .call-btn.accept { background: #34c759; color: #fff; }
    .call-btn.hold { background: #ff9500; color: #fff; }
    .call-btn.hangup { background: #ff3b30; color: #fff; }
    .call-btn:hover { opacity: 0.85; }

    /* FUNKSTEUERUNG */
    .radio-channels-row {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
    }

    .radio-btn {
      flex: 1;
      padding: 8px 4px;
      background: #1f2330;
      border: 1px solid #3a3f55;
      color: #aaa;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 11px;
      text-align: center;
    }

    .radio-btn.active-room {
      background: #007aff;
      color: #fff;
      border-color: #0056b3;
    }

    .ptt-btn-card {
      width: 100%;
      background: #3a3f55;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      user-select: none;
      text-align: center;
    }

    /* RECHTER BEREICH: SIDEBAR FÜR FAHRZEUGE UND OFFENE EINSÄTZE */
    .sidebar-panel {
      width: 380px;
      min-width: 380px;
      background: #12141d;
      border-left: 1px solid #2a2d3d;
      display: flex;
      flex-direction: column;
      height: 100%;
      box-sizing: border-box;
    }

    .sidebar-section-top {

      flex-direction: column;

    }

    .sidebar-section-bottom {

      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .sidebar-header {
      padding: 12px 15px;
      background: #181b26;
      font-size: 12px;

      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #8a8f9e;
      border-bottom: 1px solid #2a2d3d;
    }

    .sidebar-content {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }
  </style>
</head>

  let activeCallChannel = null;

  /* --- KLINGELTON SYNTHESIZER (Web Audio API) --- */
  let ringAudioCtx = null;
  let ringInterval = null;

  function playRingtoneSound() {
    if (!ringAudioCtx) {
      ringAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (ringAudioCtx.state === 'suspended') {
      ringAudioCtx.resume();
    }

    const osc1 = ringAudioCtx.createOscillator();
    const osc2 = ringAudioCtx.createOscillator();
    const gain = ringAudioCtx.createGain();

    osc1.frequency.value = 440;
    osc2.frequency.value = 480;

    gain.gain.setValueAtTime(0.15, ringAudioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ringAudioCtx.currentTime + 1.0);

    osc1.connect(gain);
    osc2.connect(gain);
    gain.connect(ringAudioCtx.destination);

    osc1.start();
    osc2.start();
    osc1.stop(ringAudioCtx.currentTime + 1.0);
  }

  function manageRingtone(hasActiveRingingCalls) {
    if (hasActiveRingingCalls) {
      if (!ringInterval) {
        playRingtoneSound();
        ringInterval = setInterval(playRingtoneSound, 3000);
      }
    } else {
      if (ringInterval) {
        clearInterval(ringInterval);
        ringInterval = null;
      }
    }
  }

  async function loadFahrzeuge() {
    const openOrgs = new Set();
    document.querySelectorAll(".org-group").forEach(group => {
      const list = group.querySelector(".vehicle-list");

      if (list && list.style.display === "block") openOrgs.add(orgName);
    });

    const { data: orgs, error: err1 } = await db.from("organisations").select("*").order("name");
    if (err1) { console.error(err1); return; }
    const { data: fahrzeuge, error: err2 } = await db.from("fahrzeuge").select("*").order("name");
    if (err2) { console.error(err2); return; }

    buildFahrzeugTree(orgs || [], fahrzeuge || [], openOrgs);
  }

  function buildFahrzeugTree(orgs, fahrzeuge, openOrgs) {
    const panel = document.getElementById("fahrzeug-panel");
    panel.innerHTML = "";

    orgs.forEach(org => {
      const orgGroup = document.createElement("div");
      orgGroup.className = "org-group";

      const orgHeader = document.createElement("div");
      orgHeader.className = "org-header";
      const isOpen = openOrgs.has(`📁 ${org.name}`);

      orgHeader.innerHTML = `<span>📁 ${escapeHtml(org.name)}</span> <span>${isOpen ? '▴' : '▾'}</span>`;

      const list = document.createElement("div");
      list.className = "vehicle-list";
      list.style.display = isOpen ? "block" : "none";

      fahrzeuge.filter(v => v.org_id === org.id).forEach(v => {
        const vehicleDiv = document.createElement("div");
        vehicleDiv.className = "vehicle-item";
        if (selectedVehicles.has(v.id)) vehicleDiv.classList.add("selected-vehicle");
        vehicleDiv.dataset.id = v.id;
        vehicleDiv.innerHTML = `
          <span>🚒 ${escapeHtml(v.name)}</span>
          <span class="status-badge">S${v.status ?? "1"}</span>
        `;

        vehicleDiv.addEventListener("click", (e) => {
          e.stopPropagation();
          const id = Number(vehicleDiv.dataset.id);
          if (selectedVehicles.has(id)) {
            selectedVehicles.delete(id);
            vehicleDiv.classList.remove("selected-vehicle");
          } else {
            selectedVehicles.add(id);
            vehicleDiv.classList.add("selected-vehicle");
          }
        });

        list.appendChild(vehicleDiv);
      });

      orgHeader.addEventListener("click", () => {
        const isVisible = list.style.display === "block";
        list.style.display = isVisible ? "none" : "block";
        orgHeader.querySelector('span:last-child').textContent = isVisible ? '▾' : '▴';
      });

      orgGroup.appendChild(orgHeader);
      orgGroup.appendChild(list);
      panel.appendChild(orgGroup);
    });

  /* ANRUFERLISTE MIT TELEFONIE-INTEGRATION */
  async function loadAnruferliste() {
    const { data: anrufe, error } = await db
      .from('anrufe')
      .select('*')
      .neq('status', 'beendet')
      .order('zeitpunkt', { ascending: true });

    const container = document.getElementById('anrufer-liste-container');
    const countBadge = document.getElementById('call-count-badge');
    container.innerHTML = "";

    if (error) {
      console.error("Fehler beim Laden der Warteschlange:", error);
      return;
    }

    if (!anrufe || anrufe.length === 0) {
      container.innerHTML = '<div class="no-calls-msg">Keine eingehenden Notrufe in der Warteschlange</div>';
      countBadge.textContent = "0 Aktiv";
      countBadge.style.color = "#8a8f9e";
      manageRingtone(false);
      return;
    }

    const hasAktivCalls = anrufe.some(c => c.status === 'aktiv' || c.status === 'klingelt');
    manageRingtone(hasAktivCalls);

    countBadge.textContent = `${anrufe.length} Aktiv`;
    countBadge.style.color = hasAktivCalls ? "#ff3b30" : "#ff9500";

    anrufe.forEach(call => {
      const item = document.createElement('div');
      item.className = `call-queue-item status-${call.status}`;

      let badgeText = '🚨 EINGEHEND';
      if (call.status === 'halten') badgeText = '⏸️ IN WARTESCHLEIFE';
      if (call.status === 'angenommen') badgeText = '📞 VERBUNDEN';

      const callerNum = escapeHtml(call.anrufer_nummer || call.rufer_nummer || '');

      item.innerHTML = `
        <div class="call-info">
          <span class="call-line-badge">${badgeText} (${escapeHtml(call.nummer || '112')})</span>

          ${call.status === 'aktiv' ? `<button class="call-btn hold" onclick="holdCall(${call.id})">⏸️ Halten</button>` : ''}
          ${call.status !== 'angenommen' ? `<button class="call-btn accept" onclick="acceptCall(${call.id}, '${callerNum}')">📞 Annehmen</button>` : ''}
          <button class="call-btn hangup" onclick="hangupCall(${call.id})">✖️ Auflegen</button>

      `;

  /* AUTOMATISCHES ÜBERTRAGEN DER NUMMER BEIM ANNEHMEN & WEBRTC NOTRUF STARTEN */
  /* AUTOMATISCHES ÜBERTRAGEN DER NUMMER BEIM ANNEHMEN & WEBRTC NOTRUF STARTEN */
async function acceptCall(callId, callerNum = "") {
  if (callerNum) {
    document.getElementById('melder').value = callerNum;
  }
  
  activeCallId = callId;

  // 1. Status in Supabase auf 'angenommen' setzen
  await db.from('anrufe').update({ status: 'angenommen' }).eq('id', callId);

  // 2. Mikrofon der Leitstelle anfordern
  try {
    callLocalStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
  } catch (err) {
    console.error("Fehler beim Mikrofon-Zugriff der LST:", err);
    alert("Mikrofon-Zugriff erforderlich für Telefonat!");
    return;
  }

  // 3. RTCPeerConnection für Anruf aufbauen
  callPeerConnection = new RTCPeerConnection(rtcPhoneConfig);

  callLocalStream.getTracks().forEach(track => {
    callPeerConnection.addTrack(track, callLocalStream);
  });

  // Remote Audio vom Handy empfangen und mit TELEFON-FILTER versehen
  callPeerConnection.ontrack = (event) => {
    // Web Audio Context für Telefon-Sound erzeugen
    const phoneAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const source = phoneAudioCtx.createMediaStreamSource(event.streams[0]);

    // 1. High-Pass Filter: Schneidet tiefe Bässe/Rumpeln unter 300 Hz ab
    const hpFilter = phoneAudioCtx.createBiquadFilter();
    hpFilter.type = "highpass";
    hpFilter.frequency.value = 300;

    // 2. Low-Pass Filter: Schneidet hohe Frequenzen über 3400 Hz ab (typischer ISDN/POTS Sound)
    const lpFilter = phoneAudioCtx.createBiquadFilter();
    lpFilter.type = "lowpass";
    lpFilter.frequency.value = 3400;

    // 3. Mitten-Anhebung (Peaking): Leichtes Anheben der Sprachpräsenz bei 1000 Hz für "Telefon-Klang"
    const presence = phoneAudioCtx.createBiquadFilter();
    presence.type = "peaking";
    presence.frequency.value = 1000;
    presence.Q.value = 1.0;
    presence.gain.value = 4.0;

    // 4. Kompressor: Drückt laute Spitzen weg und hebt leise Töne an (wie eine Telefonleitung)
    const compressor = phoneAudioCtx.createDynamicsCompressor();
    compressor.threshold.value = -20;
    compressor.knee.value = 6;
    compressor.ratio.value = 8;
    compressor.attack.value = 0.005;
    compressor.release.value = 0.05;

    // Signalkette verbinden: Stream -> HighPass -> LowPass -> Mitten -> Kompressor -> Lautsprecher
    source.connect(hpFilter);
    hpFilter.connect(lpFilter);
    lpFilter.connect(presence);
    presence.connect(compressor);
    compressor.connect(phoneAudioCtx.destination);
  };

  // ICE Candidates an das Handy über Supabase senden
  callPeerConnection.onicecandidate = (event) => {
    if (event.candidate && activeCallChannel) {
      activeCallChannel.send({
        type: 'broadcast',
        event: 'signal',
        payload: { candidate: event.candidate, sender: 'lst' }
      });
    }
  };

  // 4. Supabase Signalisierungs-Kanal für den Anruf abonnieren
  activeCallChannel = db.channel('call-' + callId)
    .on('broadcast', { event: 'signal' }, async ({ payload }) => {
      if (payload.sender === 'lst') return;

      if (payload.offer && callPeerConnection) {
        await callPeerConnection.setRemoteDescription(new RTCSessionDescription(payload.offer));
        const answer = await callPeerConnection.createAnswer();
        await callPeerConnection.setLocalDescription(answer);

        activeCallChannel.send({
          type: 'broadcast',
          event: 'signal',
          payload: { answer: answer, sender: 'lst' }
        });
      } 
      else if (payload.candidate && callPeerConnection) {
        await callPeerConnection.addIceCandidate(new RTCIceCandidate(payload.candidate));
      }
    })
    .subscribe();

  loadAnruferliste();
}

  /* NOTRUF AUFLEGEN & WEBRTC TRENNEN */
  async function hangupCall(callId) {
    await db.from('anrufe').update({ status: 'beendet' }).eq('id', callId);

    if (callPeerConnection) {
      callPeerConnection.close();
      callPeerConnection = null;
    }

    if (callLocalStream) {
      callLocalStream.getTracks().forEach(track => track.stop());
      callLocalStream = null;
    }

    if (callRemoteAudio) {
      callRemoteAudio.pause();
      callRemoteAudio.srcObject = null;
      callRemoteAudio.remove();
      callRemoteAudio = null;
    }

    if (activeCallChannel) {
      db.removeChannel(activeCallChannel);
      activeCallChannel = null;
    }

    activeCallId = null;
    loadAnruferliste();
  }

  function escapeHtml(s = "") {
    return String(s)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#39;");
  }

  async function alarmieren() {
    const melder = document.getElementById("melder").value;
    const strasse = document.getElementById("strasse").value;
    const objekt = document.getElementById("objekt").value;
    const ort = document.getElementById("ort").value;
    const stadtteil = document.getElementById("stadtteil").value;
    const stichwort = document.getElementById("stichwort").value;
    const meldebild = document.getElementById("meldebild").value;
    const sonstiges = document.getElementById("sonstiges").value;
    const sondersignale = document.getElementById("sondersignale").checked;

    if (!stichwort || !ort) {
      alert("Bitte mindestens Stichwort und Ort ausfüllen.");
      return;
    }

    const nr = 0;
    const today = new Date();
    const datum = today.toISOString().split("T")[0];
    const uhrzeit = today.toTimeString().split(":").slice(0,2).join(":");

    const { data: einsatzData, error: err } = await db
      .from("einsaetze")
      .insert([{
        datum, uhrzeit, stichwort, ort, melder,
        straße: strasse, nr, objekt, stadtteil, meldebild,
        sonstiges, sondersignale, abgeschlossen: false
      }])
      .select()
      .single();

    if (err) {
      alert("Fehler beim Anlegen: " + err.message);
      return;
    }

    const einsatzId = einsatzData.id;
    const inserts = [...selectedVehicles].map(id => ({ einsatz_id: einsatzId, fahrzeug_id: id }));
    
    if (inserts.length > 0) {
      const { error: err2 } = await db.from("einsatz_fahrzeuge").insert(inserts);
      if (err2) alert("Fehler bei Fahrzeugzuordnung: " + err2.message);
    }

    selectedVehicles.clear();
    await loadEinsaetze();
    await loadFahrzeuge();
    alert("🚨 Einsatz erfolgreich alarmiert!");
  }

  async function schliesseEinsatz() {
    if (!currentEinsatzId) { alert("Kein Einsatz ausgewählt."); return; }
    const { error } = await db.from("einsaetze").update({ abgeschlossen: true }).eq("id", currentEinsatzId);
    if (error) { alert("Fehler beim Abschließen."); return; }
    currentEinsatzId = null;
    await loadEinsaetze();
    alert("Einsatz abgeschlossen.");
  }

  function setupRealtime() {
    db.channel("realtime_fahrzeuge")
      .on("postgres_changes", { event: "*", schema: "public", table: "fahrzeuge" }, () => loadFahrzeuge())
      .subscribe();

    db.channel("realtime_einsaetze")
      .on("postgres_changes", { event: "*", schema: "public", table: "einsaetze" }, () => loadEinsaetze())
      .subscribe();

    db.channel("realtime_anrufe")
      .on("postgres_changes", { event: "*", schema: "public", table: "anrufe" }, () => loadAnruferliste())
      .subscribe((status, err) => {
        console.log("Realtime Anrufe Status:", status);
        if (err) console.error("Realtime Fehler:", err);
      });
  }

  // --- WEBRTC / AUDIO LOGIK FÜR FUNKBEDIENUNG (WEBSOCKET) ---
  const myId = "LST SB";
  let room = "DN_ALLG";
  let audioCtx, localStream, filteredStream, audioTrack;
  const pcs = {};
  const ws = new WebSocket("wss://lstsim.onrender.com");

  const talkSound = new Audio("Funken.wav");
  const endSound = new Audio("ende.wav");
  let channelBusy = false;

  function makeTetraDistortionCurve() {
    const n = 44100;
    const curve = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const x = i * 2 / n - 1;
      curve[i] = Math.tanh(x * 1.5);
    }
    return curve;
  }

  async function initAudio() {
    if (filteredStream) return;
    try {
      localStream = await navigator.mediaDevices.getUserMedia({
        audio: { noiseSuppression: true, echoCancellation: true, autoGainControl: true, sampleRate: 8000 }
      });
    } catch (err) {
      console.error("❌ Fehler beim Mikrofon-Zugriff (Funk):", err);
      return;
    }

    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioCtx.createMediaStreamSource(localStream);

    const hpFilter = audioCtx.createBiquadFilter();
    hpFilter.type = "highpass";
    hpFilter.frequency.value = 400;

    const lpFilter = audioCtx.createBiquadFilter();
    lpFilter.type = "lowpass";
    lpFilter.frequency.value = 2800;

    const presenceFilter = audioCtx.createBiquadFilter();
    presenceFilter.type = "peaking";
    presenceFilter.frequency.value = 2000;
    presenceFilter.Q.value = 2.0;
    presenceFilter.gain.value = 6.0;

    const compressor = audioCtx.createDynamicsCompressor();
    compressor.threshold.value = -24;
    compressor.knee.value = 10;
    compressor.ratio.value = 12;
    compressor.attack.value = 0.003;
    compressor.release.value = 0.25;

    const distortion = audioCtx.createWaveShaper();
    distortion.curve = makeTetraDistortionCurve();
    distortion.oversample = '2x';

    source.connect(hpFilter);
    hpFilter.connect(compressor);
    compressor.connect(presenceFilter);
    presenceFilter.connect(distortion);
    distortion.connect(lpFilter);

    const destination = audioCtx.createMediaStreamDestination();
    lpFilter.connect(destination);
    filteredStream = destination.stream;

    audioTrack = filteredStream.getAudioTracks()[0];
    audioTrack.enabled = false;
  }

  function createPeerConnection(peerId, isInitiator) {
    if (peerId === myId) return;
    if (pcs[peerId]) return pcs[peerId];

    const pc = new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.l.google.com:19302" }] });
    pcs[peerId] = pc;

    if (audioTrack) {
      pc.addTrack(audioTrack, filteredStream);
    }

    pc.ontrack = e => {
      let audioEl = document.getElementById(`audio-${peerId}`);
      if (!audioEl) {
        audioEl = document.createElement("audio");
        audioEl.id = `audio-${peerId}`;
        audioEl.autoplay = true;
        document.body.appendChild(audioEl);
      }
      audioEl.srcObject = e.streams[0];
      audioEl.play().catch(err => console.warn(`⚠️ Autoplay blockiert:`, err));
    };

    pc.onicecandidate = e => {
      if (e.candidate) {
        ws.send(JSON.stringify({
          type: "signal", room, to: peerId, from: myId, payload: { candidate: e.candidate }
        }));
      }
    };

    if (isInitiator) {
      pc.onnegotiationneeded = async () => {
        try {
          const offer = await pc.createOffer();
          await pc.setLocalDescription(offer);
          ws.send(JSON.stringify({
            type: "signal", room, to: peerId, from: myId, payload: { sdp: offer }
          }));
        } catch (err) {
          console.error("Fehler beim Offer:", err);
        }
      };
    }

    return pc;
  }

  ws.onopen = () => {
    ws.send(JSON.stringify({ type: "join", room, from: myId }));
  };

  ws.onmessage = async (event) => {
    const msg = JSON.parse(event.data);
    const statusDiv = document.getElementById("channel-status");

    if (msg.type === "user_list") {
      msg.users.forEach(peerId => {
        if (peerId !== myId) createPeerConnection(peerId, true);
      });
    }

    if (msg.type === "user_joined") {
      if (msg.id !== myId) createPeerConnection(msg.id, false);
    }

    if (msg.type === "user_left") {
      if (pcs[msg.id]) {
        pcs[msg.id].close();
        delete pcs[msg.id];
      }
      const audioEl = document.getElementById(`audio-${msg.id}`);
      if (audioEl) audioEl.remove();
    }

    if (msg.type === "signal") {
      const { from, payload } = msg;
      if (msg.to && msg.to !== myId) return;

      const pc = pcs[from] || createPeerConnection(from, false);
      if (!pc) return;

      if (payload.sdp) {
        await pc.setRemoteDescription(new RTCSessionDescription(payload.sdp));
        if (payload.sdp.type === "offer") {
          const answer = await pc.createAnswer();
          await pc.setLocalDescription(answer);
          ws.send(JSON.stringify({
            type: "signal", room, to: from, from: myId, payload: { sdp: answer }
          }));
        }
      } else if (payload.candidate) {
        try {
          await pc.addIceCandidate(new RTCIceCandidate(payload.candidate));
        } catch(e) {}
      }
    }

    if (msg.type === "lock_granted") {
      channelBusy = true;
      if (msg.holder === myId) {
        if (statusDiv) {
          statusDiv.textContent = "🎙️ Du sprichst (gesendet)";
          statusDiv.style.color = "#ff3b30";
        }
      } else {
        if (statusDiv) {
          statusDiv.textContent = `🔊 ${msg.holder} spricht...`;
          statusDiv.style.color = "#ffcc00";
        }
      }
    }
    if (msg.type === "unlock") {
      channelBusy = false;
      if (statusDiv) {
        statusDiv.textContent = "Kanal frei";
        statusDiv.style.color = "#8a8f9e";
      }
    }
  };

  function switchRoom(newRoom, btnElement) {
    room = newRoom;
    document.querySelectorAll(".radio-btn").forEach(b => b.classList.remove("active-room"));
    btnElement.classList.add("active-room");
    ws.send(JSON.stringify({ type: "join", room, from: myId }));
  }

  document.addEventListener("DOMContentLoaded", () => {
    document.body.addEventListener("click", () => {
      if (ringAudioCtx && ringAudioCtx.state === 'suspended') {
        ringAudioCtx.resume();
      }
    }, { once: true });

    loadFahrzeuge();
    loadEinsaetze();
    loadAnruferliste();
    setupRealtime();
    initAudio();

    document.getElementById("alarm-button").addEventListener("click", alarmieren);
    document.getElementById("btn2").addEventListener("click", schliesseEinsatz);
    
    document.getElementById("btn1").addEventListener("click", () => {
      document.querySelectorAll("input[type='text'], textarea").forEach(i => i.value = "");
      document.getElementById("sondersignale").checked = false;
      currentEinsatzId = null;
      document.querySelectorAll(".einsatz-item").forEach(x => x.classList.remove("selected-einsatz"));
    });

    const btnDnAllg = document.getElementById("btn_dn_allg");
    const btnDnFw = document.getElementById("btn_dn_fw");
    const btnDnPol = document.getElementById("btn_dn_pol");

    if (btnDnAllg) btnDnAllg.addEventListener("click", (e) => switchRoom("DN_ALLG", e.target));
    if (btnDnFw) btnDnFw.addEventListener("click", (e) => switchRoom("DN_FW", e.target));
    if (btnDnPol) btnDnPol.addEventListener("click", (e) => switchRoom("DN_POL", e.target));

    const pttBtn = document.getElementById("btn_ptt");

    async function startTalkingLST() {
      if (audioCtx && audioCtx.state === 'suspended') {
        await audioCtx.resume();
      }
      if (channelBusy) return;

      if (audioTrack) {
        audioTrack.enabled = true;
      }

      ws.send(JSON.stringify({ type: "request_lock", room, from: myId }));
      if (pttBtn) pttBtn.style.backgroundColor = "#ff3b30";

      talkSound.currentTime = 0;
      talkSound.play().catch(()=>{});
    }

    function stopTalkingLST() {
      if (audioTrack) {
        audioTrack.enabled = false;
      }

      ws.send(JSON.stringify({ type: "release_lock", room, from: myId }));
      if (pttBtn) pttBtn.style.backgroundColor = "";

      endSound.currentTime = 0;
      endSound.play().catch(()=>{});
    }

    if (pttBtn) {
      pttBtn.addEventListener("mousedown", startTalkingLST);
      pttBtn.addEventListener("mouseup", stopTalkingLST);
      pttBtn.addEventListener("touchstart", (e) => { e.preventDefault(); startTalkingLST(); });
      pttBtn.addEventListener("touchend", (e) => { e.preventDefault(); stopTalkingLST(); });
    }
  });
</script>
