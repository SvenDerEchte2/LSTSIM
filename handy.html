<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smartphone</title>
<!-- Supabase Client -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
    html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #0a0a0c;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    user-select: none;
  }

  /* Smartphone Gehäuse */
  .smartphone {
    position: relative;
    width: 280px;
    height: 560px;
    background: #111;
    border: 10px solid #2c2c30;
    border-radius: 36px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.8), inset 0 0 10px rgba(255,255,255,0.05);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-sizing: border-box;
  }

  /* Dynamische Insel / Notch */
  .notch {
    position: absolute;
    top: 6px;
    left: 50%;
    transform: translateX(-50%);
    width: 90px;
    height: 18px;
    background: #000;
    border-radius: 12px;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding-right: 8px;
  }
  .camera-dot {
    width: 8px;
    height: 8px;
    background: #1a1a24;
    border-radius: 50%;
    box-shadow: inset 0 0 2px #000;
  }

  /* Bildschirm-Inhalt */
  .screen {
    flex: 1;
    background: radial-gradient(circle at 50% 20%, #3a3f58 0%, #151824 50%, #0b0d14 100%);
    color: #fff;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 30px 16px 8px 16px;
    box-sizing: border-box;
    position: relative;
    overflow: hidden;
  }

  /* Statusleiste */
  .status-bar {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: rgba(255,255,255,0.85);
    font-weight: 600;
    margin-bottom: 5px;
    padding: 0 4px;
    flex-shrink: 0;
  }

  /* Eigenes Nummer-Badge auf dem Home-Screen */
  .my-number-badge {
    font-size: 11px;
    color: rgba(255, 255, 255, 0.8);
    background: rgba(255, 255, 255, 0.1);
    padding: 6px 12px;
    border-radius: 12px;
    margin-bottom: 12px;
    text-align: center;
    backdrop-filter: blur(5px);
    width: 100%;
    box-sizing: border-box;
  }

  /* App-Ansichten */
  .view {
    display: none;
    flex-direction: column;
    flex: 1;
    overflow-y: auto;
    box-sizing: border-box;
  }
  .view.active {
    display: flex !important;
  }
  .view::-webkit-scrollbar {
    width: 0px;
  }

  /* Home-Screen */
  .home-screen {
    align-items: flex-start;
    justify-content: flex-start;
    padding-top: 10px;
  }

  .app-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    width: 100%;
  }

  .app-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
  }

  .app-icon {
    width: 52px;
    height: 52px;
    background: linear-gradient(135deg, #34c759, #248a3d);
    border-radius: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 12px rgba(0,0,0,0.4), inset 0 1px 1px rgba(255,255,255,0.4);
    transition: transform 0.1s;
  }
  .app-icon.tinder-icon {
    background: linear-gradient(135deg, #fd267d, #ff6036);
  }
  .app-item:active .app-icon {
    transform: scale(0.9);
  }
  
  .app-icon svg {
    width: 26px;
    height: 26px;
    fill: #ffffff;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.2));
  }

  .app-title {
    font-size: 10px;
    margin-top: 5px;
    font-weight: 500;
    color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.9);
    text-align: center;
    letter-spacing: -0.2px;
  }

  /* Moderner Smartphone Dialer */
  .dialer-screen {
    justify-content: space-between;
    padding-top: 10px;
  }

  .dialer-top {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
  }

  .phone-display-container {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    min-height: 40px;
    margin-top: 10px;
    position: relative;
  }

  .phone-display {
    font-size: 28px;
    font-weight: 300;
    letter-spacing: 1px;
    text-align: center;
    color: #fff;
    outline: none;
  }

  .delete-btn {
    background: none;
    border: none;
    color: rgba(255,255,255,0.5);
    font-size: 18px;
    cursor: pointer;
    position: absolute;
    right: 10px;
    padding: 5px;
  }
  .delete-btn:active {
    color: #fff;
  }

  /* Tastenfeld */
  .keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    width: 100%;
    max-width: 220px;
    margin: 0 auto;
  }

  .key {
    background: rgba(255, 255, 255, 0.08);
    border: none;
    border-radius: 50%;
    width: 56px;
    height: 56px;
    color: white;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, transform 0.1s;
    margin: 0 auto;
    backdrop-filter: blur(5px);
  }
  .key:active {
    background: rgba(255, 255, 255, 0.25);
    transform: scale(0.92);
  }

  .key-number {
    font-size: 20px;
    font-weight: 400;
    line-height: 1.1;
  }

  .key-letters {
    font-size: 7px;
    letter-spacing: 1.2px;
    color: rgba(255, 255, 255, 0.5);
    text-transform: uppercase;
    font-weight: 600;
  }

  .dialer-actions {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    margin-bottom: 5px;
  }

  .call-btn {
    background: #34c759 !important;
    border-radius: 50%;
    width: 56px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(52, 199, 89, 0.4);
    transition: transform 0.1s;
  }
  .call-btn:active {
    transform: scale(0.92);
    background: #248a3d !important;
  }

  /* Anruf-Aktiv Bildschirm */
  .active-call-screen {
    align-items: center;
    justify-content: space-between;
    text-align: center;
    padding: 20px 0 10px 0;
  }

  .call-timer {
    font-size: 14px;
    color: rgba(255, 255, 255, 0.7);
    font-variant-numeric: tabular-nums;
    margin-top: 6px;
  }

  .call-actions-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    width: 100%;
    max-width: 220px;
    margin: 20px auto;
  }

  .call-action-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    background: none;
    border: none;
    color: #fff;
    cursor: pointer;
    gap: 6px;
  }

  .call-action-icon {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.12);
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(5px);
    transition: background 0.2s, transform 0.1s;
  }

  .call-action-btn:active .call-action-icon {
    transform: scale(0.92);
  }

  .call-action-btn.active .call-action-icon {
    background: #ffffff;
  }

  .call-action-btn.active .call-action-icon svg {
    fill: #000000;
  }

  .call-action-label {
    font-size: 10px;
    color: rgba(255, 255, 255, 0.8);
    font-weight: 400;
  }

  .hangup-btn {
    background: #ff3b30;
    color: white;
    border: none;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 6px 15px rgba(255, 59, 48, 0.4);
    transition: transform 0.1s;
    margin: 0 auto;
  }
  .hangup-btn:active {
    transform: scale(0.92);
  }

  /* --- BLITZBEGEGNUNG STYLES --- */
  .tinder-header {
    display: flex;
    justify-content: center;
    align-items: center;
    padding-bottom: 8px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    margin-bottom: 8px;
  }
  .tinder-logo {
    font-weight: 800;
    font-size: 15px;
    background: linear-gradient(135deg, #fd267d, #ff6036);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* Formular Account anlegen */
  .tinder-form {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding-top: 2px;
  }
  .tinder-input, .tinder-select {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 8px;
    padding: 6px 8px;
    color: #fff;
    font-size: 11px;
    outline: none;
  }
  .tinder-select option {
    background: #1e222d;
    color: #fff;
  }
  .tinder-input::placeholder { color: rgba(255,255,255,0.4); }
  .tinder-file-label {
    background: rgba(255,255,255,0.1);
    border: 1px dashed rgba(255,255,255,0.3);
    border-radius: 8px;
    padding: 8px;
    text-align: center;
    font-size: 10px;
    cursor: pointer;
    color: rgba(255,255,255,0.8);
  }
  .tinder-submit-btn {
    background: linear-gradient(135deg, #fd267d, #ff6036);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 8px;
    font-weight: bold;
    cursor: pointer;
    font-size: 11px;
    margin-top: 4px;
  }

  /* Swipe Karte */
  .tinder-card-container {
    flex: 1;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    margin-bottom: 5px;
  }
  .tinder-card {
    width: 100%;
    height: 280px;
    background: #1e222d;
    border-radius: 16px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 10px 20px rgba(0,0,0,0.5);
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
  }
  .tinder-card img {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .tinder-card-gradient {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 70%;
    background: linear-gradient(to top, rgba(0,0,0,0.95) 10%, rgba(0,0,0,0.4) 60%, transparent);
    z-index: 1;
  }
  .tinder-card-info {
    position: relative;
    z-index: 2;
    padding: 10px;
  }
  .tinder-card-name {
    font-size: 16px;
    font-weight: bold;
  }
  .tinder-card-sub {
    font-size: 10px;
    color: #ff6036;
    margin-top: 1px;
    font-weight: 500;
  }
  .tinder-card-details {
    font-size: 10px;
    color: rgba(255,255,255,0.85);
    margin-top: 3px;
    line-height: 1.2;
  }
  .tinder-card-tag {
    display: inline-block;
    background: rgba(255,255,255,0.15);
    padding: 2px 6px;
    border-radius: 6px;
    font-size: 9px;
    margin-top: 4px;
    margin-right: 3px;
  }
  .tinder-actions {
    display: flex;
    justify-content: center;
    gap: 30px;
    margin-top: 4px;
  }
  .tinder-action-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: none;
    background: #1e222d;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    cursor: pointer;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.1s;
  }
  .tinder-action-btn:active { transform: scale(0.9); }
  .btn-nope { color: #ff3b30; }
  .btn-like { color: #34c759; }

  /* Eigenes Profil Info Ansicht */
  .my-profile-box {
    background: rgba(255,255,255,0.05);
    border-radius: 12px;
    padding: 8px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .my-profile-img {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid #fd267d;
  }

  /* Home Indicator Strich */
  .home-indicator-bar {
    width: 100%;
    height: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    flex-shrink: 0;
  }

  .home-indicator {
    width: 100px;
    height: 4px;
    background: rgba(255, 255, 255, 0.4);
    border-radius: 2px;
    transition: background 0.2s, transform 0.1s;
  }
  .home-indicator-bar:active .home-indicator {
    background: rgba(255, 255, 255, 0.8);
    transform: scaleX(0.95);
  }
</style>
</head>
<body>

<div class="smartphone">
  <div class="notch"><div class="camera-dot"></div></div>
  <div class="screen">
    <!-- Statusleiste -->
    <div class="status-bar">
      <span id="phone-clock">12:00</span>
      <span>5G 📶 🔋</span>
    </div>

    <!-- ANSICHT 1: Home Screen -->
    <div id="home-view" class="view active home-screen">
      <div id="my-number-badge" class="my-number-badge">📱 Nummer wird geladen...</div>

      <div class="app-grid">
        <div class="app-item" onclick="openDialer()">
          <div class="app-icon">
            <svg viewBox="0 0 24 24">
              <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
            </svg>
          </div>
          <span class="app-title">Telefon</span>
        </div>

        <!-- Blitzbegegnung App Icon -->
        <div class="app-item" onclick="openTinderApp()">
          <div class="app-icon tinder-icon">
            <svg viewBox="0 0 24 24">
              <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
          </div>
          <span class="app-title">Blitzbegegnung</span>
        </div>
      </div>
    </div>

    <!-- ANSICHT 2: Moderner Dialer + Kontakte & Historie -->
    <div id="dialer-view" class="view dialer-screen" style="overflow-y: auto;">
      <div class="dialer-top">
        <div class="phone-display-container">
          <div id="dialed-number" class="phone-display"></div>
          <button class="delete-btn" onclick="clearKey()" id="delete-btn" style="display: none;">⌫</button>
        </div>
      </div>
      
      <div class="keypad">
        <button class="key" onclick="pressKey('1')"><span class="key-number">1</span><span class="key-letters">&nbsp;</span></button>
        <button class="key" onclick="pressKey('2')"><span class="key-number">2</span><span class="key-letters">ABC</span></button>
        <button class="key" onclick="pressKey('3')"><span class="key-number">3</span><span class="key-letters">DEF</span></button>
        <button class="key" onclick="pressKey('4')"><span class="key-number">4</span><span class="key-letters">GHI</span></button>
        <button class="key" onclick="pressKey('5')"><span class="key-number">5</span><span class="key-letters">JKL</span></button>
        <button class="key" onclick="pressKey('6')"><span class="key-number">6</span><span class="key-letters">MNO</span></button>
        <button class="key" onclick="pressKey('7')"><span class="key-number">7</span><span class="key-letters">PQRS</span></button>
        <button class="key" onclick="pressKey('8')"><span class="key-number">8</span><span class="key-letters">TUV</span></button>
        <button class="key" onclick="pressKey('9')"><span class="key-number">9</span><span class="key-letters">WXYZ</span></button>
        <button class="key" onclick="pressKey('*')"><span class="key-number">*</span><span class="key-letters">&nbsp;</span></button>
        <button class="key" onclick="pressKey('0')"><span class="key-number">0</span><span class="key-letters">+</span></button>
        <button class="key" onclick="pressKey('#')"><span class="key-number">#</span><span class="key-letters">&nbsp;</span></button>
      </div>

      <div class="dialer-actions">
        <button class="call-btn" onclick="makeCall()">
          <svg style="width:24px;height:24px;fill:#fff;" viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
        </button>
      </div>

      <!-- ZUSATZ: Kontakte & Letzte Anrufe -->
      <div style="padding: 10px; margin-top: 10px; border-top: 1px solid #333; font-size: 12px; text-align: left;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
          <strong style="color: #fff;">📖 Kontakte</strong>
          <button onclick="addContact()" style="background: #34c759; color: #fff; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 10px;">➕ Neu</button>
        </div>
        <div id="contacts-list" style="margin-bottom: 15px;"></div>

        <strong style="color: #fff; display: block; margin-bottom: 8px;">🕒 Anrufverlauf</strong>
        <div id="history-list"></div>
      </div>
    </div>

    <!-- ANSICHT 3: Aktiver Anruf -->
    <div id="call-view" class="view active-call-screen">
      <div>
        <div style="font-size: 13px; color: rgba(255,255,255,0.6); font-weight: 500; margin-top: 10px;">Telefonat</div>
        <div id="called-display-number" style="font-size: 26px; font-weight: bold; letter-spacing: 1px; margin-top: 4px;">---</div>
        <div id="call-status-text" style="font-size: 14px; color: #34c759; font-weight: 500; margin-top: 6px;">Verbinde...</div>
        <div id="call-timer" class="call-timer">00:00</div>
      </div>
      
      <div class="call-actions-grid">
        <button class="call-action-btn" id="btn-mute" onclick="toggleMute()">
          <div class="call-action-icon">
            <svg style="width:22px;height:22px;fill:#fff;" viewBox="0 0 24 24">
              <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/>
            </svg>
          </div>
          <span class="call-action-label">Stumm</span>
        </button>

        <button class="call-action-btn" onclick="openDialerFromCall()">
          <div class="call-action-icon">
            <svg style="width:22px;height:22px;fill:#fff;" viewBox="0 0 24 24">
              <path d="M12 10c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0-6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 12c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6-6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0-6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 12c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12-6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0-6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 12c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
            </svg>
          </div>
          <span class="call-action-label">Tasten</span>
        </button>

        <button class="call-action-btn" id="btn-speaker" onclick="toggleSpeaker()">
          <div class="call-action-icon">
            <svg style="width:22px;height:22px;fill:#fff;" viewBox="0 0 24 24">
              <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
            </svg>
          </div>
          <span class="call-action-label">Lautsprecher</span>
        </button>
      </div>

      <div style="margin-bottom: 15px;">
        <button class="hangup-btn" onclick="endCall()">

  // -- SOUND GENERATOR (WEB AUDIO API) --
  let audioCtx = null;

  const dtmfFreqs = {
    '1': [697, 1209], '2': [697, 1336], '3': [697, 1477],
    '4': [770, 1209], '5': [770, 1336], '6': [770, 1477],
    '7': [852, 1209], '8': [852, 1336], '9': [852, 1477],
    '*': [941, 1209], '0': [941, 1336], '#': [941, 1477]
  };

  function getAudioContext() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    return audioCtx;
  }

  function unlockSpeechAndAudio() {
    getAudioContext();
    if ('speechSynthesis' in window) {
      window.speechSynthesis.resume();
      const dummy = new SpeechSynthesisUtterance(' ');
      dummy.volume = 0;
      window.speechSynthesis.speak(dummy);
    }
  }

  function playDTMF(key) {
    const freqs = dtmfFreqs[key];
    if (!freqs) return;
    try {
      const ctx = getAudioContext();
      const osc1 = ctx.createOscillator();
      const osc2 = ctx.createOscillator();
      const gain = ctx.createGain();

      osc1.frequency.value = freqs[0];
      osc2.frequency.value = freqs[1];

      gain.gain.setValueAtTime(0.08, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.12);

      osc1.connect(gain);
      osc2.connect(gain);
      gain.connect(ctx.destination);

      osc1.start();
      osc2.start();
      osc1.stop(ctx.currentTime + 0.12);
      osc2.stop(ctx.currentTime + 0.12);
    } catch(e) {}
  }

  function startRingbackTone() {
    stopRingbackTone();
    try {
      const ctx = getAudioContext();
      function playTone() {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.value = 425;

        gain.gain.setValueAtTime(0.06, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 1.0);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start();
        osc.stop(ctx.currentTime + 1.0);
      }
      playTone();
      ringInterval = setInterval(playTone, 2500);
    } catch(e) {}
  }

  function stopRingbackTone() {
    if (ringInterval) {
      clearInterval(ringInterval);
      ringInterval = null;
    }
  }

  function playHoldAnnouncement() {
    stopHoldAnnouncement();

    document.getElementById('call-status-text').style.color = "#ff9500";

    function speakText() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.resume();
        window.speechSynthesis.cancel();
        setTimeout(() => {
          const text = "Alle Disponenten sind derzeit belegt. Bitte warten Sie, Ihr Anruf wird gehalten.";
          const utterance = new SpeechSynthesisUtterance(text);
          const voices = window.speechSynthesis.getVoices();
          const germanVoice = voices.find(v => v.lang && v.lang.startsWith('de'));
          if (germanVoice) utterance.voice = germanVoice;
          utterance.lang = 'de-DE';
          utterance.rate = 0.95;
          window.speechSynthesis.speak(utterance);
        }, 100);
      }
    }

    speakText();
    holdInterval = setInterval(() => {
      if (currentCallStatus === 'gehalten') {
        speakText();
      }
    }, 8000);
  }

  function stopHoldAnnouncement() {
    if (holdInterval) {
      clearInterval(holdInterval);
      holdInterval = null;
    }
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
    }
  }

  // ==========================================
  // --- WEBRTC & SOUND-FILTER LOGIK ---
  // ==========================================

  async function setupWebRTC() {
    try {
      localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    } catch (err) {
      console.error("Mikrofon-Zugriff verweigert:", err);
      alert("Mikrofon-Zugriff wird für Telefonate benötigt!");
      return false;
    }

    peerConnection = new RTCPeerConnection(rtcConfig);

    localStream.getTracks().forEach(track => {
      peerConnection.addTrack(track, localStream);
    });

    // Remote Audio mit Telefon-Soundfilter verarbeiten
    peerConnection.ontrack = (event) => {
      const stream = event.streams[0];

      // Erstelle unsichtbares HTML-Audio Element
      if (!remoteAudio) {
        remoteAudio = document.createElement('audio');
        remoteAudio.autoplay = true;
      }
      
      // Web Audio API Telefon-Filterkette (HighPass, LowPass, Compressor)
      try {
        const phoneCtx = getAudioContext();
        const source = phoneCtx.createMediaStreamSource(stream);

        const hp = phoneCtx.createBiquadFilter();
        hp.type = "highpass";
        hp.frequency.value = 300;

        const lp = phoneCtx.createBiquadFilter();
        lp.type = "lowpass";
        lp.frequency.value = 3400;

        const compressor = phoneCtx.createDynamicsCompressor();
        compressor.threshold.value = -20;
        compressor.ratio.value = 8;

        source.connect(hp);
        hp.connect(lp);
        lp.connect(compressor);
        compressor.connect(phoneCtx.destination);
      } catch (e) {
        // Fallback: Direkter Stream ohne Filter bei AudioContext Fehlern
        remoteAudio.srcObject = stream;
      }
    };

    peerConnection.onicecandidate = (event) => {
      if (event.candidate && callRealtimeChannel) {
        callRealtimeChannel.send({
          type: 'broadcast',
          event: 'signal',
          payload: { candidate: event.candidate, sender: myPhoneNumber }
        });
      }
    };

    return true;
  }

  async function createAndSendOffer() {
    if (!peerConnection) return;
    const offer = await peerConnection.createOffer();
    await peerConnection.setLocalDescription(offer);

    if (callRealtimeChannel) {
      callRealtimeChannel.send({
        type: 'broadcast',
        event: 'signal',
        payload: { offer: offer, sender: myPhoneNumber }
      });
    }
  }

  function closeWebRTC() {
    if (peerConnection) {
      peerConnection.close();
      peerConnection = null;
    }
    if (localStream) {
      localStream.getTracks().forEach(track => track.stop());
      localStream = null;
    }
    if (remoteAudio) {
      remoteAudio.pause();
      remoteAudio.srcObject = null;
      remoteAudio.remove();
      remoteAudio = null;
    }
  }

  // ==========================================
  // --- TELEFONIE LOGIK (EIN- & AUSGEHEND) ---
  // ==========================================

  // 1. AUSGEHENDER ANRUF (Jede Nummer wählbar)
  async function makeCall(targetNum = currentNumber) {
    if (!targetNum) return;
    if (targetNum === myPhoneNumber) {
      alert("Du kannst dich nicht selbst anrufen!");
      return;
    }

    unlockSpeechAndAudio();
    currentNumber = targetNum;
    
    document.getElementById('called-display-number').textContent = currentNumber;
    document.getElementById('call-status-text').textContent = "Verbinde...";
    document.getElementById('call-status-text').style.color = "#34c759";
    document.getElementById('call-timer').textContent = "00:00";
    
    document.getElementById('btn-mute').classList.remove('active');
    document.getElementById('btn-speaker').classList.remove('active');
    
    switchView('call-view');
    startRingbackTone();
    currentCallStatus = 'klingelt';

    try {
      // Anruf in DB erstellen
      const { data, error } = await supabaseClient
        .from('anrufe')
        .insert([{ 
          nummer: currentNumber, 
          anrufer_nummer: myPhoneNumber,
          status: 'klingelt', 
          zeitpunkt: new Date() 
        }])
        .select();

      if (error) {
        document.getElementById('call-status-text').textContent = "Fehler beim Wählen";
        stopRingbackTone();
        return;
      }

      if (data && data.length > 0) {
        activeCallId = data[0].id;

        // Realtime Signalisierungs-Kanal öffnen
        callRealtimeChannel = supabaseClient
          .channel('call-' + activeCallId)
          .on(
            'postgres_changes',
            { event: 'UPDATE', schema: 'public', table: 'anrufe', filter: `id=eq.${activeCallId}` },
            async (payload) => {
              const newStatus = payload.new.status;
              currentCallStatus = newStatus;

              if (newStatus === 'angenommen' || newStatus === 'verbunden') {
                onCallConnected();
              } else if (newStatus === 'gehalten' || newStatus === 'halten') {
                playHoldAnnouncement();
              } else if (newStatus === 'beendet' || newStatus === 'abgelehnt') {
                endCall();
              }
            }
          )
          .on('broadcast', { event: 'signal' }, async ({ payload }) => {
            if (payload.sender === myPhoneNumber) return;

            if (payload.answer && peerConnection) {
              await peerConnection.setRemoteDescription(new RTCSessionDescription(payload.answer));
            } else if (payload.candidate && peerConnection) {
              await peerConnection.addIceCandidate(new RTCIceCandidate(payload.candidate));
            }
          })
          .subscribe();
      }
    } catch (err) {
      stopRingbackTone();
    }
  }

  // 2. EINGEHENDE ANRUFE HÖREN
  function listenForIncomingCalls() {
    if (!myPhoneNumber) return;
    if (incomingCallsChannel) supabaseClient.removeChannel(incomingCallsChannel);

    incomingCallsChannel = supabaseClient
      .channel('incoming-calls-' + myPhoneNumber)
      .on(
        'postgres_changes',
        {
          event: 'INSERT',
          schema: 'public',
          table: 'anrufe',
          filter: `nummer=eq.${myPhoneNumber}`
        },
        (payload) => {
          const call = payload.new;
          if (call.status === 'klingelt' && !activeCallId) {
            showIncomingCallUI(call);
          }
        }
      )
      .subscribe();
  }

  function showIncomingCallUI(call) {
    activeCallId = call.id;
    startRingbackTone();

    const accept = confirm(`📞 Eingehender Anruf von ${call.anrufer_nummer}!\n\nAnnehmen?`);
    stopRingbackTone();

    if (accept) {
      acceptCall(call);
    } else {
      rejectCall(call.id);
    }
  }

  // 3. ANRUF ANNEHMEN (Callee)
  async function acceptCall(call) {
    unlockSpeechAndAudio();
    activeCallId = call.id;
    currentNumber = call.anrufer_nummer;

    document.getElementById('called-display-number').textContent = currentNumber;
    document.getElementById('call-status-text').textContent = "Verbunden";
    document.getElementById('call-status-text').style.color = "#34c759";
    switchView('call-view');

    // Status in DB auf 'angenommen' setzen
    await supabaseClient.from('anrufe').update({ status: 'angenommen' }).eq('id', call.id);

    const rtcSuccess = await setupWebRTC();
    if (!rtcSuccess) return;

    callRealtimeChannel = supabaseClient
      .channel('call-' + activeCallId)
      .on(
        'postgres_changes',
        { event: 'UPDATE', schema: 'public', table: 'anrufe', filter: `id=eq.${activeCallId}` },
        async (payload) => {
          if (payload.new.status === 'beendet') {
            endCall();
          }
        }
      )
      .on('broadcast', { event: 'signal' }, async ({ payload }) => {
        if (payload.sender === myPhoneNumber) return;

        if (payload.offer && peerConnection) {
          await peerConnection.setRemoteDescription(new RTCSessionDescription(payload.offer));
          const answer = await peerConnection.createAnswer();
          await peerConnection.setLocalDescription(answer);

          callRealtimeChannel.send({
            type: 'broadcast',
            event: 'signal',
            payload: { answer: answer, sender: myPhoneNumber }
          });
        } else if (payload.candidate && peerConnection) {
          await peerConnection.addIceCandidate(new RTCIceCandidate(payload.candidate));
        }
      })
      .subscribe();

    startCallTimer();
  }

  // 4. ANRUF ABLEHNEN
  async function rejectCall(callId) {
    await supabaseClient.from('anrufe').update({ status: 'abgelehnt' }).eq('id', callId);
    activeCallId = null;
    loadCallHistory();
  }

  // 5. ANRUF VERBUNDEN TRAFFIC (Caller Side Offer)
  async function onCallConnected() {
    stopRingbackTone();
    stopHoldAnnouncement();

    document.getElementById('call-status-text').textContent = "Verbunden";
    document.getElementById('call-status-text').style.color = "#34c759";

    const rtcSuccess = await setupWebRTC();
    if (rtcSuccess) {
      await createAndSendOffer();
    }

    startCallTimer();
  }

  function startCallTimer() {
    callSeconds = 0;
    if (callTimerInterval) clearInterval(callTimerInterval);
    callTimerInterval = setInterval(() => {
      callSeconds++;
      const m = Math.floor(callSeconds / 60).toString().padStart(2, '0');
      const s = (callSeconds % 60).toString().padStart(2, '0');
      document.getElementById('call-timer').textContent = `${m}:${s}`;
    }, 1000);
  }

  async function endCall() {
    stopRingbackTone();
    stopHoldAnnouncement();
    closeWebRTC();

    if (callTimerInterval) {
      clearInterval(callTimerInterval);
      callTimerInterval = null;
    }

    if (callRealtimeChannel) {
      supabaseClient.removeChannel(callRealtimeChannel);
      callRealtimeChannel = null;
    }

    if (activeCallId) {
      try {
        await supabaseClient
          .from('anrufe')
          .update({ status: 'beendet' })
          .eq('id', activeCallId);
      } catch (err) {}
      activeCallId = null;
    }
    loadCallHistory();
    openDialer();
  }

  function autoEndCallOnUnload() {
    if (!activeCallId) return;
    const url = `${SUPABASE_URL}/rest/v1/anrufe?id=eq.${activeCallId}`;
    const body = JSON.stringify({ status: 'beendet' });
    fetch(url, {
      method: 'PATCH',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
        'Prefer': 'return=minimal'
      },
      body: body,
      keepalive: true
    });
  }

  window.addEventListener('pagehide', autoEndCallOnUnload);
  window.addEventListener('beforeunload', autoEndCallOnUnload);

  // --- KONTAKTE & ANRUFHISTORIE ---
  // ==========================================

  // Letzte Anrufe laden
  async function loadCallHistory() {
    if (!myPhoneNumber) return;

    const { data: history } = await supabaseClient
      .from('anrufe')
      .select('*')
      .or(`anrufer_nummer.eq.${myPhoneNumber},nummer.eq.${myPhoneNumber}`)
      .order('zeitpunkt', { ascending: false })
      .limit(15);

    const container = document.getElementById('history-list');
    if (!container) return;
    container.innerHTML = "";

    (history || []).forEach(call => {
      const isOutgoing = call.anrufer_nummer === myPhoneNumber;
      const partner = isOutgoing ? call.nummer : call.anrufer_nummer;
      const icon = isOutgoing ? "↗️" : "↙️";
      const time = call.zeitpunkt ? new Date(call.zeitpunkt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';

      const item = document.createElement('div');
      item.className = 'history-item';
      item.style.cssText = "display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #333; align-items:center;";
      item.innerHTML = `
        <div>
          <span>${icon} <strong>${escapeHtml(partner || 'Unbekannt')}</strong></span>
          <small style="color:#8a8f9e; display:block;">${time} • ${call.status}</small>
        </div>
        <button onclick="makeCall('${escapeHtml(partner)}')" style="padding:4px 8px; border-radius:6px;">📞</button>
      `;
      container.appendChild(item);
    });
  }

  // Kontakte laden
  async function loadContacts() {
    if (!currentAuthUserId) return;

    const { data: kontakte } = await supabaseClient
      .from('kontakte')
      .select('*')
      .order('name', { ascending: true });

    const container = document.getElementById('contacts-list');
    if (!container) return;
    container.innerHTML = "";

    (kontakte || []).forEach(k => {
      const item = document.createElement('div');
      item.className = 'contact-item';
      item.style.cssText = "display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #333; align-items:center;";
      item.innerHTML = `
        <div>
          <strong>${escapeHtml(k.name)}</strong><br>
          <small style="color:#4cd964;">📞 ${escapeHtml(k.nummer)}</small>
        </div>
        <div>
          <button onclick="makeCall('${escapeHtml(k.nummer)}')" style="padding:4px 8px; border-radius:6px; margin-right:4px;">📞</button>
          <button onclick="deleteContact(${k.id})" style="padding:4px 8px; border-radius:6px; background:#ff3b30; color:#fff;">🗑️</button>
        </div>
      `;
      container.appendChild(item);
    });
  }

  // Kontakt hinzufügen
  async function addContact() {
    const name = prompt("Name des Kontakts:");
    if (!name) return;
    const nummer = prompt("Telefonnummer:");
    if (!nummer) return;

    const { error } = await supabaseClient
      .from('kontakte')
      .insert([{ name, nummer, user_id: currentAuthUserId }]);

    if (error) {
      alert("Fehler beim Speichern: " + error.message);
    } else {
      loadContacts();
    }
  }

  // Kontakt löschen
  async function deleteContact(id) {
    if (!confirm("Kontakt wirklich löschen?")) return;
    const { error } = await supabaseClient.from('kontakte').delete().eq('id', id);
    if (error) {
      alert("Fehler beim Löschen: " + error.message);
    } else {
      loadContacts();
    }
  }

  function escapeHtml(str) {
    return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // ==========================================
  // --- BLITZBEGEGNUNG LOGIK (TINDER APP) ---
  // ==========================================

  const fileInput = document.getElementById('t-file');
  if(fileInput) {
    fileInput.addEventListener('change', (e) => {
      if(e.target.files.length > 0) {
        document.getElementById('t-file-name').textContent = "Bild bereit: " + e.target.files[0].name;
      }
    });
  }

  async function openTinderApp() {
    switchView('tinder-view');
    await checkTinderProfile();
  }

  async function checkTinderProfile() {
    if (!currentAuthUserId) return;

    const { data, error } = await supabaseClient
      .from('blitzbegegnung_profile')
      .select('*')
      .eq('user_id', currentAuthUserId)
      .maybeSingle();

    if (data) {
      myTinderProfile = data;
      document.getElementById('tinder-create-section').style.display = 'none';
      document.getElementById('tinder-swipe-section').style.display = 'flex';

      document.getElementById('my-tinder-name').textContent = `${data.name}, ${data.alter_zahl}`;
      document.getElementById('my-tinder-details').textContent = `${data.geschlecht || ''} • sucht ${data.suche_nach || ''} ${data.wohnort ? '• 📍 ' + data.wohnort : ''}`;
      document.getElementById('my-tinder-img').src = data.bild_url || 'https://via.placeholder.com/150?text=Ich';

      loadTinderDeck();
    } else {
      myTinderProfile = null;
      document.getElementById('tinder-create-section').style.display = 'flex';
      document.getElementById('tinder-swipe-section').style.display = 'none';

      document.getElementById('t-name').value = '';
      document.getElementById('t-age').value = '';
      document.getElementById('t-city').value = '';
      document.getElementById('t-gender').value = '';
      document.getElementById('t-seeking').value = '';
      document.getElementById('t-hobbies').value = '';
      document.getElementById('t-bio').value = '';
      document.getElementById('t-file').value = '';
      document.getElementById('t-file-name').textContent = '';
    }
  }

  async function createTinderProfile() {
    const name = document.getElementById('t-name').value.trim();
    const alter = parseInt(document.getElementById('t-age').value);
    const wohnort = document.getElementById('t-city').value.trim();
    const geschlecht = document.getElementById('t-gender').value;
    const suche_nach = document.getElementById('t-seeking').value;
    const hobbys = document.getElementById('t-hobbies').value.trim();
    const bio = document.getElementById('t-bio').value.trim();
    const fileElem = document.getElementById('t-file');

    if (!name || isNaN(alter) || !geschlecht || !suche_nach) {
      alert('Bitte fülle Name, Alter, Geschlecht und Suche aus!');
      return;
    }

    let bildUrl = '';

    if (fileElem.files.length > 0) {
      const file = fileElem.files[0];
      const fileExt = file.name.split('.').pop();
      const fileName = `${currentAuthUserId}_${Date.now()}.${fileExt}`;
      
      const { error: uploadError } = await supabaseClient.storage
        .from('blitzbegegnung')
        .upload(fileName, file);

      if (uploadError) {
        alert('Fehler beim Bildupload: ' + uploadError.message);
        return;
      }

      const { data: publicUrlData } = supabaseClient.storage
        .from('blitzbegegnung')
        .getPublicUrl(fileName);

      bildUrl = publicUrlData.publicUrl;
    }

    const { error } = await supabaseClient
      .from('blitzbegegnung_profile')
      .insert([
        {
          user_id: currentAuthUserId,
          name: name,
          alter_zahl: alter,
          geschlecht: geschlecht,
          suche_nach: suche_nach,
          wohnort: wohnort,
          hobbys: hobbys,
          bio: bio,
          bild_url: bildUrl
        }
      ]);

    if (error) {
      alert('Fehler beim Speichern: ' + error.message);
    } else {
      await checkTinderProfile();
    }
  }

  async function deleteTinderProfile() {
    if (!confirm('Möchtest du deinen Account wirklich löschen? Danach kannst du einen neuen erstellen.')) return;

    const { error } = await supabaseClient
      .from('blitzbegegnung_profile')
      .delete()
      .eq('user_id', currentAuthUserId);

    if (error) {
      alert('Fehler beim Löschen: ' + error.message);
    } else {
      await checkTinderProfile();
    }
  }

  async function loadTinderDeck() {
    const { data, error } = await supabaseClient
      .from('blitzbegegnung_profile')
      .select('*')
      .neq('user_id', currentAuthUserId);

    if (data) {
      tinderProfiles = data;
      tinderIndex = 0;
      renderCurrentCard();
    }
  }

  function renderCurrentCard() {
    const cardBox = document.getElementById('tinder-card-box');
    const deckElem = document.getElementById('tinder-deck');
    const emptyElem = document.getElementById('tinder-empty');

    if (tinderIndex < tinderProfiles.length) {
      deckElem.style.display = 'flex';
      emptyElem.style.display = 'none';

      const p = tinderProfiles[tinderIndex];
      cardBox.innerHTML = `
        <div class="tinder-card">
          <img src="${p.bild_url || 'https://via.placeholder.com/280x280?text=Kein+Bild'}" alt="Profilbild">
          <div class="tinder-card-gradient"></div>
          <div class="tinder-card-info">
            <div class="tinder-card-name">${p.name}, ${p.alter_zahl}</div>
            <div class="tinder-card-sub">
              ${p.geschlecht || ''} • sucht ${p.suche_nach || ''} ${p.wohnort ? '• 📍 ' + p.wohnort : ''}
            </div>
            ${p.bio ? `<div class="tinder-card-details">${p.bio}</div>` : ''}
            ${p.hobbys ? `<div class="tinder-card-tag">⚽ ${p.hobbys}</div>` : ''}
          </div>
        </div>
      `;
    } else {
      deckElem.style.display = 'none';
      emptyElem.style.display = 'flex';
    }
  }

  function nextCard() {
    tinderIndex++;
    renderCurrentCard();
  }
</script>

</body>
</html>
