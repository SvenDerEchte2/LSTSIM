// --- REALISTISCHE SYNTHETISCHE AUDIO-EFFEKTE (Web Audio API) ---
let audioCtx, localStream, filteredStream, audioTrack;
let audioReady = false; 
const pcs = {}; 
const myId = fahrzeug;
const ws = new WebSocket("wss://lstsim.onrender.com");

let channelBusy = false;
let deviceOn = false;
let pttRequested = false;
let totTimer = null; // Time-out-timer
let pendingUsers = [];

function initAudioContext() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
}

// 1. TETRA Freigabeton (Kanal-Zuteilung "Gong")
function playGrantTone() {
  initAudioContext();
  const now = audioCtx.currentTime;
  
  const osc1 = audioCtx.createOscillator();
  const osc2 = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc1.type = 'sine';
  osc2.type = 'sine';

  // TETRA charakteristische Frequenzen
  osc1.frequency.setValueAtTime(900, now);
  osc1.frequency.setValueAtTime(1200, now + 0.08);
  
  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(0.15, now + 0.01);
  gain.gain.setValueAtTime(0.15, now + 0.15);
  gain.gain.linearRampToValueAtTime(0, now + 0.18);

  osc1.connect(gain);
  gain.connect(audioCtx.destination);

  osc1.start(now);
  osc1.stop(now + 0.18);
}

// 2. Belegtton (Kanal besetzt)
function playBusyTone() {
  initAudioContext();
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = 'square';
  osc.frequency.setValueAtTime(450, now);

  gain.gain.setValueAtTime(0.1, now);
  gain.gain.setValueAtTime(0, now + 0.1);
  gain.gain.setValueAtTime(0.1, now + 0.2);
  gain.gain.setValueAtTime(0, now + 0.3);

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start(now);
  osc.stop(now + 0.3);
}

// 3. Squelch Tail (Digitales Entrauschen beim Auflegen)
function playSquelchTail() {
  initAudioContext();
  const bufferSize = audioCtx.sampleRate * 0.06; // 60ms Rauschen
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);

  for (let i = 0; i < bufferSize; i++) {
    data[i] = Math.random() * 2 - 1;
  }

  const noise = audioCtx.createBufferSource();
  noise.buffer = buffer;

  const filter = audioCtx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.value = 1800;
  filter.Q.value = 1.2;

  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.06);

  noise.connect(filter);
  filter.connect(gain);
  gain.connect(audioCtx.destination);

  noise.start();
}

// 4. Status Quittungston
function playStatusTone() {
  initAudioContext();
  const now = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = 'sine';
  osc.frequency.setValueAtTime(1400, now);
  
  gain.gain.setValueAtTime(0.12, now);
  gain.gain.linearRampToValueAtTime(0, now + 0.1);

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start(now);
  osc.stop(now + 0.1);
}

// --- TETRA ACELP CODEC & DSP FILTER KETTE ---
async function initAudio() {
  if (filteredStream) return;
  try {
    localStream = await navigator.mediaDevices.getUserMedia({
      audio: { 
        noiseSuppression: true, 
        echoCancellation: true, 
        autoGainControl: true,
        sampleRate: 16000 
      }
    });
  } catch (err) {
    console.error("❌ Mikrofon-Fehler:", err);
    return;
  }

  initAudioContext();
  const source = audioCtx.createMediaStreamSource(localStream);

  // Doppelte Filter (24 dB/Okt.) für den steilen Handfunk-Gehäuse-Sound
  const hpFilter1 = audioCtx.createBiquadFilter();
  hpFilter1.type = "highpass";
  hpFilter1.frequency.value = 380;

  const hpFilter2 = audioCtx.createBiquadFilter();
  hpFilter2.type = "highpass";
  hpFilter2.frequency.value = 380;

  const lpFilter1 = audioCtx.createBiquadFilter();
  lpFilter1.type = "lowpass";
  lpFilter1.frequency.value = 3100;

  const lpFilter2 = audioCtx.createBiquadFilter();
  lpFilter2.type = "lowpass";
  lpFilter2.frequency.value = 3100;

  // Funk-Typischer Mitten-Druck (1.4 kHz)
  const bodyBoost = audioCtx.createBiquadFilter();
  bodyBoost.type = "peaking";
  bodyBoost.frequency.value = 1400;
  bodyBoost.Q.value = 1.2;
  bodyBoost.gain.value = 4.0;

  // Höhenschärfe für 100% Sprachverständlichkeit (2.6 kHz)
  const clarityBoost = audioCtx.createBiquadFilter();
  clarityBoost.type = "peaking";
  clarityBoost.frequency.value = 2600;
  clarityBoost.Q.value = 2.0;
  clarityBoost.gain.value = 6.0;

  // TETRA Vocoder-Grit (48-Stufen-Quantisierung + leichte Sättigung)
  const distortion = audioCtx.createWaveShaper();
  const n = 2048;
  const curve = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    let x = (i * 2) / n - 1;
    let saturated = Math.tanh(x * 1.8);
    curve[i] = Math.round(saturated * 48) / 48; 
  }
  distortion.curve = curve;

  // Funk-AGC / Limiter für knackige Lautstärke
  const compressor = audioCtx.createDynamicsCompressor();
  compressor.threshold.value = -22;
  compressor.knee.value = 4;
  compressor.ratio.value = 10;
  compressor.attack.value = 0.003;
  compressor.release.value = 0.08;

  // Signalkette verbinden
  source.connect(hpFilter1);
  hpFilter1.connect(hpFilter2);
  hpFilter2.connect(bodyBoost);
  bodyBoost.connect(clarityBoost);
  clarityBoost.connect(distortion);
  distortion.connect(lpFilter1);
  lpFilter1.connect(lpFilter2);
  lpFilter2.connect(compressor);

  const destination = audioCtx.createMediaStreamDestination();
  compressor.connect(destination);
  filteredStream = destination.stream;

  audioTrack = filteredStream.getAudioTracks()[0];
  audioTrack.enabled = false;
  audioReady = true;

  pendingUsers.forEach(peerId => {
    createPeerConnection(peerId, true);
  });
  pendingUsers = [];
}

function createPeerConnection(peerId, isInitiator) {
  if (peerId === myId) return;
  if (pcs[peerId]) return pcs[peerId];

  if (!audioReady) {
    if (!pendingUsers.includes(peerId)) pendingUsers.push(peerId);
    return;
  }

  const pc = new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.l.google.com:19302" }] });
  pcs[peerId] = pc;

  if (audioTrack) {
    pc.addTrack(audioTrack, filteredStream);
  }

  pc.ontrack = e => {
    let audioEl = document.getElementById(`audio-${peerId}`);
    if (!audioEl) {
      audioEl = document.createElement("audio");
      audioEl.id = `audio-${peerId}`;
      audioEl.autoplay = true;
      document.body.appendChild(audioEl);
    }
    audioEl.srcObject = e.streams[0];
  };

  pc.onicecandidate = e => {
    if (e.candidate) {
      ws.send(JSON.stringify({
        type: "signal", room, to: peerId, from: myId, payload: { candidate: e.candidate }
      }));
    }
  };

  if (isInitiator) {
    pc.onnegotiationneeded = async () => {
      try {
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        ws.send(JSON.stringify({
          type: "signal", room, to: peerId, from: myId, payload: { sdp: offer }
        }));
      } catch (err) {}
    };
  }

  return pc;
}

ws.onopen = () => {
  ws.send(JSON.stringify({ type: "join", room, from: myId }));
};

ws.onmessage = async (event) => {
  const msg = JSON.parse(event.data);

  if (msg.type === "user_list") {
    msg.users.forEach(peerId => {
      if (peerId !== myId) createPeerConnection(peerId, true);
    });
  }

  if (msg.type === "user_joined") {
    if (msg.id !== myId) createPeerConnection(msg.id, false);
  }

  if (msg.type === "user_left") {
    if (pcs[msg.id]) {
      pcs[msg.id].close();
      delete pcs[msg.id];
    }
    const audioEl = document.getElementById(`audio-${msg.id}`);
    if (audioEl) audioEl.remove();
  }

  if (msg.type === "signal") {
    const { from, payload } = msg;
    if (msg.to && msg.to !== myId) return;

    const pc = pcs[from] || createPeerConnection(from, false);
    if (!pc) return;

    if (payload.sdp) {
      await pc.setRemoteDescription(new RTCSessionDescription(payload.sdp));
      if (payload.sdp.type === "offer") {
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        ws.send(JSON.stringify({
          type: "signal", room, to: from, from: myId, payload: { sdp: answer }
        }));
      }
    } else if (payload.candidate) {
      try {
        await pc.addIceCandidate(new RTCIceCandidate(payload.candidate));
      } catch(e) {}
    }
  }

  if (msg.type === "lock_granted") {
    channelBusy = true;
    if (deviceOn) {
      setDisplayText(msg.holder);
      if (msg.holder === myId) {
        // Kanal-Freigabe für uns selbst erhalten!
        playGrantTone();
        setLedState("red");
        subText.textContent = "TX (Senden)";
        radioStateIcon.textContent = "TX";

        // Sprecherlaubnis-Verzögerung für Mikrofonöffnung
        setTimeout(() => {
          if (pttRequested && audioTrack) {
            audioTrack.enabled = true;
          }
        }, 180);

        // Time-Out-Timer (TOT): Max. 30 Sekunden Sprechzeit
        totTimer = setTimeout(() => {
          stopTalking();
        }, 30000);

      } else {
        // Jemand anderes spricht
        setLedState("blue");
        subText.textContent = "RX (Empfang)";
        radioStateIcon.textContent = "RX";
      }
    }
  }

  if (msg.type === "unlock") {
    channelBusy = false;
    if (deviceOn) {
      playSquelchTail();
      setDisplayText(room);
      radioStateIcon.textContent = "IDLE";
      setLedState("standby");
      fetchAndDisplayStatus();
    }
  }
};

async function powerOnSequence() {
  deviceOn = true;
  displayPanel.style.backgroundColor = "#fff";
  setLedState("red"); 
  bootImage.style.display = "block";
  setDisplayText(""); 
  subText.textContent = "";

  await initAudio();
  if (audioCtx && audioCtx.state === 'suspended') {
    await audioCtx.resume();
  }

  await fetchAndDisplayStatus();

  setTimeout(() => {
    bootImage.style.display = "none";
    statusBar.style.display = "flex";
    mainDisplayContent.style.display = "flex";
    softkeyBar.style.display = "flex";
    setDisplayText(room);
    radioStateIcon.textContent = "IDLE";
    setLedState("standby");
  }, 4000);
}

function updateClock() {
  const now = new Date();
  const hours = now.getHours().toString().padStart(2,'0');
  const minutes = now.getMinutes().toString().padStart(2,'0');
  clock.textContent = `${hours}:${minutes}`;
}
setInterval(updateClock, 1000);
updateClock();

// --- PTT / FUNK-ABLAUF ---
const btnPTT = document.getElementById('btn-actionRuf');

function startTalking() {
  if (!deviceOn) return;

  if (channelBusy) {
    playBusyTone();
    return;
  }

  pttRequested = true;
  setLedState("yellow"); // Verbindungsaufbau zum Netz
  subText.textContent = "Kanalruf...";

  ws.send(JSON.stringify({ type: "request_lock", room, from: myId }));
}

function stopTalking() {
  if (!deviceOn || !pttRequested) return;

  pttRequested = false;
  if (totTimer) {
    clearTimeout(totTimer);
    totTimer = null;
  }

  if (audioTrack) {
    audioTrack.enabled = false;
  }

  ws.send(JSON.stringify({ type: "release_lock", room, from: myId }));
  setDisplayText(room);
  radioStateIcon.textContent = "IDLE";
  setLedState("standby");

  fetchAndDisplayStatus();
}

btnPTT.addEventListener('mousedown', startTalking);
btnPTT.addEventListener('mouseup', stopTalking);
btnPTT.addEventListener('touchstart', (e) => { e.preventDefault(); startTalking(); });
btnPTT.addEventListener('touchend', (e) => { e.preventDefault(); stopTalking(); });

window.addEventListener('pagehide', async () => {
  if (!fahrzeug) return;
  await supabaseClient
    .from('fahrzeuge')
    .update({ besetzt: false })
    .eq('name', fahrzeug);
});
</script>
